/* Foreløbig samlet stilling under scoringen */
.live-board{background:#233847;border:1px solid #4b6677;border-radius:15px;padding:12px;margin:0 0 13px;box-shadow:0 8px 24px #101a273b}
.live-board-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:9px}
.live-board-title{font-size:13px;color:#efd29b;font-weight:850;letter-spacing:.02em}
.live-board-note{font-size:10px;color:#b8c7d0;white-space:nowrap}
.live-board-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.live-person{display:flex;align-items:center;gap:6px;padding:8px;background:#162936;border:1px solid #425c6a;border-radius:9px;min-width:0}
.live-person.first{background:#453c2e;border-color:#9b7c46}
.live-rank{flex:none;width:16px;color:#d6b879;font-size:11px;font-weight:800}
.live-name{color:#e7eff0;font-size:12px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.live-points{color:#f2d195;font-variant-numeric:tabular-nums;font-size:17px;font-weight:900;white-space:nowrap}
@media(min-width:550px){.live-board-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:550px){.shell{padding-top:29px}.cards{grid-template-columns:1fr 1fr}.score-card{min-height:125px}.mini-grid.three .mini-step{width:29px}.panel{padding:23px}.score-bottom{margin-left:-15px;margin-right:-15px}}

.wonder-draw-title{font-family:Georgia,serif;font-size:18px;font-weight:800;color:#2b3b46}
.wonder-draw-subtitle{font-size:11px;color:#82755e;margin-top:3px}

.wonder-assignments{display:grid;gap:7px}
.wonder-assignment{display:flex;align-items:center;gap:10px;background:#fffaf0;border:1px solid #e2d4bd;padding:10px 11px;border-radius:11px;min-width:0}
.wonder-player{flex:0 1 43%;font-size:12px;font-weight:750;color:#546068;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wonder-assigned{flex:1;min-width:0;text-align:right}

 .stage-hero{padding:17px 16px 16px}.hero-glyph{width:57px;height:62px;font-size:27px}.stage-hero h1{font-size:28px}.stage-sub{margin-top:14px}.cards{padding:8px;grid-template-columns:1fr}.score-card{padding:13px}.score-bottom{margin:14px -12px -25px;padding:11px 12px calc(14px + env(safe-area-inset-bottom))}.score-bottom .btn{padding:11px 9px;font-size:12px}.score-bottom .btn-primary{flex:1.6}
 .rank-row{gap:8px;padding:11px 9px}.rank-name{font-size:15px}.rank-detail{font-size:10px}.rank-pts{font-size:24px}

<script>
(()=>{'use strict';
 const K='seven-wonders-score-2026-v1';
 const availableExp=[['leaders','👑','Leaders','Lederskikkelser'],['cities','🌃','Cities','Sorte kort og gæld'],['armada','⚓','Armada','Flåde og øer'],['edifice','🏛️','Edifice','Fælles byggeprojekter'],['wonderpack','🌍','Wonder Pack','Ekstra vidundere']];
 const baseWonders=[
 {id:'alexandria',label:'Alexandria',set:'Grundspil'},
 {id:'babylon',label:'Babylon',set:'Grundspil'},
 {id:'ephesos',label:'Ephesos',set:'Grundspil'},
 {id:'giza',label:'Giza',set:'Grundspil'},
 {id:'halikarnassos',label:'Halikarnassos',set:'Grundspil'},
 {id:'olympia',label:'Olympia',set:'Grundspil'},
 {id:'rhodos',label:'Rhodos',set:'Grundspil'}
 ];
 const extraWonders={
 leaders:[{id:'roma',label:'Roma',set:'Leaders'},{id:'abu-simbel',label:'Abu Simbel',set:'Leaders'}],
 cities:[{id:'byzantium',label:'Byzantium',set:'Cities'},{id:'petra',label:'Petra',set:'Cities'}],
 armada:[{id:'siracusa',label:'Siracusa',set:'Armada'}],
 edifice:[{id:'ur',label:'Ur',set:'Edifice'},{id:'carthago',label:'Carthago',set:'Edifice'}],
 // Abu Simbel findes også i den originale Wonder Pack, men kræver Leaders.
 // Det er allerede i Leaders-puljen og må ikke trækkes to gange.
 wonderpack:[{id:'stonehenge',label:'Stonehenge',set:'Wonder Pack'},{id:'great-wall',label:'Den Kinesiske Mur',set:'Wonder Pack'},{id:'manneken-pis',label:'Manneken Pis',set:'Wonder Pack'}]
 };
 function wonderPool(){
 const all=[...baseWonders];
 for(const [key,list] of Object.entries(extraWonders))if(state.exp[key])all.push(...list);
 return all;
 }
 function shuffle(list){
 const a=[...list];
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a;
 }
 function rollWonders(){
 const pool=wonderPool();
 const before=state.players.map(p=>p.wonder).join('|');
 let next=[];
 // Prøv at undgå samme fordeling ved endnu et tryk på knappen.
 for(let tries=0;tries<8;tries++){
   next=shuffle(pool).slice(0,state.players.length);
   if(next.map(w=>w.id).join('|')!==before)break;
 }
 state.players.forEach((p,i)=>p.wonder=next[i]?.id||null);
 }
 function syncWonders(){
 const pool=wonderPool(),valid=new Set(pool.map(w=>w.id)),used=new Set();
 const free=shuffle(pool).map(w=>w.id);
 state.players.forEach(p=>{
   if(!valid.has(p.wonder)||used.has(p.wonder))p.wonder=null;
   if(p.wonder)used.add(p.wonder);
 });
 state.players.forEach(p=>{
   if(p.wonder)return;
   const available=free.find(id=>!used.has(id));
   p.wonder=available||null;
   if(available)used.add(available);
 });
 }
 function wonderInfo(p){return wonderPool().find(w=>w.id===p.wonder)}
 function renderWonderDraw(){
  return `<section class="wonder-draw" aria-label="Tilfældige vidundere"><div class="wonder-draw-header"><div><div class="wonder-draw-title">🎲 Fordeling af vidundere</div><div class="wonder-draw-subtitle">${wonderPool().length} mulige · alle får forskellige</div></div><button type="button" class="btn btn-secondary wonder-reroll" data-action="reroll-wonders">↻ Træk igen</button></div><div class="wonder-assignments">${state.players.map((p,i)=>{
  const w=wonderInfo(p);return `<div class="wonder-assignment"><span class="number-ball">${i+1}</span><span class="wonder-player" data-wonder-player="${p.id}">${esc(name(p))}</span><span class="wonder-assigned"><strong>${w?esc(w.label):'Ikke trukket'}</strong><small>${w?esc(w.set):''}</small></span></div>`
 }).join('')}</div>${state.exp.wonderpack&&!state.exp.leaders?'<div class="counter-note">Abu Simbel fra Wonder Pack kræver Leaders og er derfor ikke med i puljen.</div>':''}</section>`;
 }
 const defs=[
 {id:'military',name:'Militær',glyph:'⚔️',color:'#efc9c0',desc:'Læg værdien af dine sejrsmærker sammen, og træk nederlag fra.',tip:'Sejrsmærker: +1 (tidsalder I), +3 (II), +5 (III). Nederlag: −1 hver.',type:'signed'},
 {id:'coins',name:'Mønter',glyph:'🪙',color:'#efdaa4',desc:'Indtast det antal mønter, du har tilbage. Appen giver 1 point pr. hele 3 mønter.',tip:'Mønter bruges også til at afgøre uafgjorte placeringer. Eventuel gæld fra Cities scores separat.',type:'coins'},
 {id:'wonder',name:'Vidunder',glyph:'🏛️',color:'#e3d4bc',desc:'Læg point fra dine byggede vidundertrin sammen.',tip:'Tæl kun færdigbyggede trin, der giver point. Ekstra effektpoint fra Edifice føres i Edifice-kategorien.',type:'points'},
 {id:'blue',name:'Blå kort',glyph:'🔷',color:'#cde0fc',desc:'Læg sejrspoint på alle dine blå bygninger sammen.',tip:'Med Armada medregnes også point fra det blå skib på flådebrættet.',type:'points'},
 {id:'science',name:'Videnskab',glyph:'⚙️',color:'#cfe8c8',desc:'Tæl de tre videnskabssymboler. Pointene beregnes automatisk.',tip:'Hver slags giver antal² point, plus 7 pr. komplet sæt. Ægte valgfrie symboler placeres optimalt. Symboler fra fx Mask eller Majority skal først omsættes til den type, de faktisk giver.',type:'science'},
 {id:'yellow',name:'Gule kort',glyph:'🏺',color:'#f0e3a9',desc:'Læg de sejrspoint sammen, som dine gule kort giver.',tip:'Mønter fra gule kort tælles kun i møntkategorien — ikke her.',type:'points'},
 {id:'guilds',name:'Gilder',glyph:'✦',color:'#e2d4f3',desc:'Læg pointene fra dine lilla gildekort sammen.',tip:'Med Armada må hvert enkelt lilla kort højst give 10 point. Begræns hvert kort, før du lægger pointene sammen.',type:'points'},
 {id:'leaders',name:'Leaders',glyph:'👑',color:'#dfdad4',desc:'Læg pointene fra dine lederkort sammen.',tip:'Effekter, der giver videnskabssymboler, mønter eller militærmærker, tælles i de tilsvarende kategorier — undgå dobbeltoptælling.',type:'points'},
 {id:'cities',name:'Cities',glyph:'🌃',color:'#c6c8d0',desc:'Læg point fra dine sorte Cities-kort sammen, og registrér gældsmærker.',tip:'Hvert Cities-gældsmærke giver −1 point. Mønttab tælles ikke igen her.',type:'cities'},
 {id:'naval',name:'Flådekampe',glyph:'⚓',color:'#c6e2e8',desc:'Læg point fra alle flådesejre og flådenederlag sammen.',tip:'Indtast de faktiske point på dine Armada-kampmærker — ikke antallet af skjolde.',type:'signed'},
 {id:'islands',name:'Øer',glyph:'🏝️',color:'#bee1df',desc:'Læg sejrspoint fra opdagede økort sammen.',tip:'Effekter fra økort, som allerede tælles som mønter, videnskab eller andet, skal ikke tælles igen her.',type:'points'},
 {id:'edifice',name:'Edifice',glyph:'🏗️',color:'#ebd2bb',desc:'Tilføj eventuelle direkte sejrspoint fra fællesprojekter, og marker Edifice-gæld.',tip:'Gæld: tidsalder I = −2, II = −3, III = −5. Andre projektbelønninger som mønter og militærmærker regnes i deres normale kategorier.',type:'edifice'}
 ];
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const clamp=(x,min=-999,max=999)=>Math.max(min,Math.min(max,Number.isFinite(x)?Math.trunc(x):0));
 const defaultData=()=>({military:0,coins:0,wonder:0,blue:0,science:{tablet:0,gear:0,compass:0,wild:0},yellow:0,guilds:0,leaders:0,cities:0,cityDebt:0,naval:0,islands:0,edifice:0,edDebt:[false,false,false]});
 const newP=i=>({id:'p'+Date.now().toString(36)+i,name:'Spiller '+(i+1),team:i%2,wonder:null,data:defaultData()});
 const initial=()=>({view:'setup',players:Array.from({length:3},(_,i)=>newP(i)),exp:{leaders:false,cities:false,armada:false,edifice:false,wonderpack:false},teams:false,step:0});
 let state;
 try{const raw=JSON.parse(localStorage.getItem(K));if(raw&&Array.isArray(raw.players)&&raw.exp){state=raw;state.players=state.players.map((p,i)=>({id:p.id||'p'+i,name:p.name||'Spiller '+(i+1),team:Number.isFinite(+p.team)?+p.team:i%2,wonder:p.wonder||null,data:{...defaultData(),...(p.data||{}),science:{...defaultData().science,...(p.data?.science||{})},edDebt:Array.isArray(p.data?.edDebt)?p.data.edDebt.slice(0,3):[false,false,false]}}));}else state=initial();}catch(_){state=initial()}
 const app=document.getElementById('app');
 function save(){try{localStorage.setItem(K,JSON.stringify(state))}catch(_){}}
 const active=()=>defs.filter(x=>!(['leaders','cities','naval','islands','edifice'].includes(x.id))||(x.id==='leaders'&&state.exp.leaders)||(x.id==='cities'&&state.exp.cities)||((x.id==='naval'||x.id==='islands')&&state.exp.armada)||(x.id==='edifice'&&state.exp.edifice));
 function n(v){const z=Number(v);return clamp(z,0,999)}
 function scienceScore(sc){let best=-1;let dist=[0,0,0];let base=[n(sc.tablet),n(sc.gear),n(sc.compass)];let wild=Math.min(n(sc.wild),30);for(let a=0;a<=wild;a++)for(let b=0;b<=wild-a;b++){let c=wild-a-b;let v=[base[0]+a,base[1]+b,base[2]+c];let score=v.reduce((x,y)=>x+y*y,0)+7*Math.min(...v);if(score>best){best=score;dist=[a,b,c]}}return {score:best,dist}}
 function categoryScore(p,id){let d=p.data;switch(id){case 'coins':return Math.floor(n(d.coins)/3);case 'science':return scienceScore(d.science).score;case 'cities':return clamp(+d.cities||0)-n(d.cityDebt);case 'edifice':return clamp(+d.edifice||0)-(d.edDebt?.[0]?2:0)-(d.edDebt?.[1]?3:0)-(d.edDebt?.[2]?5:0);default:return clamp(+d[id]||0)}}
 const total=p=>active().reduce((a,x)=>a+categoryScore(p,x.id),0);
 const name=p=>p.name.trim()||'Spiller';
 const teamsEnabled=()=>state.teams&&(state.exp.cities||state.exp.armada)&&(state.players.length===4||state.players.length===6);
 function toast(msg){const x=document.getElementById('toast');x.textContent=msg;x.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('show'),2300)}
 function render(){if(state.view==='setup')renderSetup();else if(state.view==='results')renderResults();else renderStage();save()}
 function renderSetup(){syncWonders();const canTeams=state.players.length%2===0&&state.players.length>=4&&(state.exp.cities||state.exp.armada);
 if(!canTeams)state.teams=false;
 app.innerHTML=`<section class="panel setup-panel"><div class="eyebrow">KLARGØR DIN CIVILISATION</div><div class="setup-title-bar"><h1>Før storhedstiden</h1><button type="button" class="btn-newgame-mini" data-action="new" aria-label="Start et nyt spil og nulstil alle point">↻ Nyt spil</button></div><p class="intro">Saml jeres civilisationer, vælg udvidelser og træk vidundere. Når spillet er slut, tæller I point område for område.</p><div class="section-top"><span class="section-title">Antal spillere</span><div class="count-control"><button type="button" data-count="-1" aria-label="Fjern spiller" ${state.players.length<=3?'disabled':''}>−</button><strong>${state.players.length}</strong><button type="button" data-count="1" aria-label="Tilføj spiller" ${state.players.length>=7?'disabled':''}>+</button></div></div><div class="name-list">${state.players.map((p,i)=>`<div class="name-row"><span class="number-ball">${i+1}</span><label class="visually-hidden" for="n${i}">Navn, spiller ${i+1}</label><input id="n${i}" data-name="${p.id}" maxlength="28" value="${esc(p.name)}" placeholder="Spiller ${i+1}" autocomplete="off">${canTeams&&state.teams?`<select class="team-select" data-team="${p.id}" aria-label="Hold for ${esc(name(p))}">${Array.from({length:state.players.length/2},(_,j)=>`<option value="${j}" ${p.team===j?'selected':''}>Hold ${String.fromCharCode(65+j)}</option>`).join('')}</select>`:''}</div>`).join('')}</div><div class="section-top"><span class="section-title">Udvidelser</span><span class="small-muted">Vælg frit</span></div><div class="expand-grid">${availableExp.map(([id,emoji,title,subtitle])=>`<label class="expansion ${state.exp[id]?'is-on':''}"><input type="checkbox" data-exp="${id}" ${state.exp[id]?'checked':''}><span class="exp-emoji">${emoji}</span><span><strong>${title}</strong><small>${subtitle}</small></span></label>`).join('')}</div>${canTeams?`<label class="age-toggle" style="margin-top:15px"><input type="checkbox" data-opt="teams" ${state.teams?'checked':''}> Holdspil (2 spillere pr. hold)</label>`:''}${renderWonderDraw()}<div class="note">Wonder Pack giver flere vidundere, men ingen ny pointkategori. Babel er udeladt som ønsket.</div><button class="btn btn-primary wide setup-start" data-action="start">${state.view==='setup'&&state.step>0?'Fortsæt scoring':'Start scoring'} <span aria-hidden="true">→</span></button></section><p class="muted-legend">Scoringen gemmes automatisk på denne enhed. Appen fungerer uden internet.</p>`}
 function liveBoardRows(){const rows=sortedResults();return rows.map((x,i)=>`<div class="live-person ${i===0?'first':''}" title="${esc(name(x.p))}: ${x.v} point i alt"><span class="live-rank">${rankingLabel(x,i,rows)}.</span><span class="live-name">${esc(name(x.p))}</span><span class="live-points">${x.v}</span></div>`).join('')}
 function liveBoard(){return `<aside class="live-board" aria-label="Foreløbig samlet stilling"><div class="live-board-head"><span class="live-board-title">◆ Samlet stilling</span><span class="live-board-note">Opdateres løbende · point i alt</span></div><div class="live-board-grid" data-live-board>${liveBoardRows()}</div></aside>`}
 function refreshLiveBoard(){const board=document.querySelector('[data-live-board]');if(board)board.innerHTML=liveBoardRows()}
 function layoutStep(c,i,len){const pct=Math.round((i+1)/len*100);return `<div class="step-header"><div class="top-links"><button class="text-btn" data-action="setup">‹ Opsætning</button><span class="stage-progress">OMRÅDE ${i+1} / ${len}</span><button class="text-btn" data-action="results">Resultater ›</button></div><div class="progress-track"><div class="progress-inner" style="width:${pct}%"></div></div><div class="newgame-actions"><button type="button" class="btn-newgame-mini dark" data-action="new">↻ Nyt spil</button></div></div>${liveBoard()}<section class="score-panel category-${c.id}" style="--category-accent:${c.color}"><div class="stage-hero"><div class="hero-title-row"><div class="hero-glyph" style="--tint:${c.color}">${c.glyph}</div><div><div class="eyebrow">CIVILISATIONENS BEDRIFTER</div><h1>${c.name}</h1></div></div><div class="stage-sub">${c.desc}</div><div class="stage-tip">${c.tip}</div></div><div class="cards">${state.players.map(p=>makeCard(p,c)).join('')}</div></section><div class="score-bottom"><button class="btn btn-quiet" data-action="back" ${i===0?'disabled':''}>← Tilbage</button><button class="btn btn-primary" data-action="next">${i===len-1?'Se resultater':'Næste område'} →</button></div>`}
 function renderStage(){let stages=active();state.step=clamp(state.step,0,stages.length-1);app.innerHTML=layoutStep(stages[state.step],state.step,stages.length)}
 const curVal=(p,id,key)=>key?key.startsWith('science.')?n(p.data.science[key.split('.')[1]]):n(p.data[key]):p.data[id]||0;
 function buttons(p,key,signed=false){const vals=signed?[1,3,5,-1,-3,-5]:[1,5,10,-1,-5,-10];return `<div class="quick-buttons">${vals.map(v=>`<button type="button" class="${v<0?'negative':''}" data-add="${v}" data-key="${key}" data-player="${p.id}" aria-label="${v>0?'+':''}${v} point til ${esc(name(p))}">${v>0?'+':''}${v}</button>`).join('')}</div>`}
 function stepControl(p,key,value,label){return `<div><div class="mini-label">${label}</div><div class="mini-counter"><button class="mini-step" data-add="-1" data-player="${p.id}" data-key="${key}" aria-label="Fjern ${esc(label)}">−</button><strong class="mini-num" data-view="${p.id}:${key}">${value}</strong><button class="mini-step" data-add="1" data-player="${p.id}" data-key="${key}" aria-label="Tilføj ${esc(label)}">+</button></div></div>`}
 function makeCard(p,c){let id=c.id;let hd=`<article class="score-card" data-card="${p.id}"><div class="player-card-top"><div class="player-card-ident"><div class="player-name">${esc(name(p))}</div><div class="player-wonder-label">${esc(wonderInfo(p)?.label||'')}</div></div><div class="score-chip"><b data-score="${p.id}">${categoryScore(p,id)}</b> <span>point</span></div></div>`;
 if(c.type==='science'){let s=p.data.science;let out=scienceScore(s);return hd+`<div class="mini-grid three">${stepControl(p,'science.tablet',n(s.tablet),'📜 Tavler')}${stepControl(p,'science.gear',n(s.gear),'⚙️ Tandhjul')}${stepControl(p,'science.compass',n(s.compass),'🧭 Passere')}</div><div class="mini-divider"></div><div class="mini-grid">${stepControl(p,'science.wild',n(s.wild),'✦ Valgfrie symboler')}<div style="display:flex;align-items:end;justify-content:center;text-align:center;font-size:11px;line-height:1.5;color:#736e62">Bedste fordeling<br><strong data-wild="${p.id}" style="font-size:13px;color:#3b4b4c">${out.dist.join(' / ')}</strong></div></div><div class="counter-note">Valgfrie symboler fordeles automatisk for flest mulige point.</div></article>`}
 if(c.type==='edifice'){return hd+`<div class="mini-label">Direkte VP fra færdige projekter</div><div class="counter-row"><input class="score-field" type="number" inputmode="numeric" data-input="edifice" data-player="${p.id}" min="0" max="999" value="${n(p.data.edifice)}">${buttons(p,'edifice')}</div><div class="mini-divider"></div><div class="mini-label">Gældsmærker fra mislykkede projekter</div>${[-2,-3,-5].map((v,i)=>`<label class="age-toggle"><input type="checkbox" data-eddebt="${i}" data-player="${p.id}" ${p.data.edDebt?.[i]?'checked':''}> Tidsalder ${['I','II','III'][i]} <em>${v} point</em></label>`).join('')}</article>`}
 if(c.type==='cities'){return hd+`<div class="mini-label">Point fra sorte kort</div><div class="counter-row"><input class="score-field" type="number" inputmode="numeric" data-input="cities" data-player="${p.id}" min="0" max="999" value="${n(p.data.cities)}">${buttons(p,'cities')}</div><div class="mini-divider"></div><div class="mini-grid">${stepControl(p,'cityDebt',n(p.data.cityDebt),'Gældsmærker (−1)')}<div style="color:#777366;align-self:end;font-size:11px;line-height:1.45">1 minuspoint pr. Cities-gældsmærke</div></div></article>`}
 let val=c.type==='coins'?n(p.data.coins):clamp(+p.data[id]||0,c.type==='signed'?-999:0,999);
 return hd+`<div class="counter-row"><label class="visually-hidden" for="f${p.id}${id}">${c.type==='coins'?'Antal mønter':'Point'} for ${esc(name(p))}</label><input id="f${p.id}${id}" class="score-field" type="number" inputmode="numeric" data-input="${id}" data-player="${p.id}" min="${c.type==='signed'?-999:0}" max="999" value="${val}">${buttons(p,id,c.type==='signed')}</div>${c.type==='coins'?`<div class="counter-note"><span data-coin="${p.id}">${n(p.data.coins)} mønter = ${Math.floor(n(p.data.coins)/3)} point</span></div>`:''}</article>`}
 function refreshCard(p){const c=active()[state.step];let score=categoryScore(p,c.id);document.querySelectorAll('[data-score="'+p.id+'"]').forEach(e=>e.textContent=score);const st=p.data.science;
 document.querySelectorAll('[data-wild="'+p.id+'"]').forEach(e=>e.textContent=scienceScore(st).dist.join(' / '));document.querySelectorAll('[data-coin="'+p.id+'"]').forEach(e=>e.textContent=n(p.data.coins)+' mønter = '+Math.floor(n(p.data.coins)/3)+' point');document.querySelectorAll('[data-view^="'+p.id+':"]').forEach(e=>{let key=e.dataset.view.split(':')[1];e.textContent=key.startsWith('science.')?n(st[key.split('.')[1]]):n(p.data[key])});refreshLiveBoard();}
 function sortedResults(){let players=state.players.map(p=>({p,v:total(p),coin:n(p.data.coins)}));players.sort((a,b)=>b.v-a.v||b.coin-a.coin);return players}
 function rankingLabel(x,i,list){if(i===0)return 1;let rank=1;for(let j=1;j<=i;j++)if(list[j].v!==list[j-1].v||list[j].coin!==list[j-1].coin)rank=j+1;return rank}
 function renderResults(){let arr=sortedResults(),stages=active();const first=arr[0],winners=arr.filter(x=>x.v===first.v&&x.coin===first.coin);let teamhtml='';
 if(teamsEnabled()){const groups=Array.from({length:state.players.length/2},(_,i)=>({id:i,players:state.players.filter(p=>p.team===i)})).map(g=>({...g,points:g.players.reduce((sum,p)=>sum+total(p),0),coins:g.players.reduce((sum,p)=>sum+n(p.data.coins),0)})).sort((a,b)=>b.points-a.points||b.coins-a.coins);teamhtml=`<div class="result-section"><div class="section-title">Holdresultater</div><div class="team-wins">${groups.map((g,i)=>`<div class="team-win">${i===0?'🏆 ':''}Hold ${String.fromCharCode(65+g.id)} · ${g.players.map(x=>esc(name(x))).join(' + ')} <span>${g.points} p</span></div>`).join('')}</div></div>`}
 const winnerTitle=teamsEnabled()?'Individuelle resultater':winners.length>1?'Delt førsteplads':'Vinderen er';
 app.innerHTML=`<div class="step-header"><div class="top-links"><button class="text-btn" data-action="back-from-results">‹ Sidste område</button><span class="stage-progress">FÆRDIG</span><button type="button" class="text-btn new-game-link" data-action="new">↻ Nyt spil</button></div></div><section class="panel final-panel"><div class="results-hero"><div class="laurel">❦</div><div class="eyebrow">CIVILISATIONERNES EFTERMÆLE</div><h1>Ære og berømmelse</h1><p>${state.players.length} spillere · ${stages.length} scoreområder</p></div>${teamhtml}<div class="winner-label">${winnerTitle}</div>${!teamsEnabled()?`<div class="winner-name">${winners.map(x=>esc(name(x.p))).join(' & ')}</div>`:''}<div class="ranking">${arr.map((x,i)=>`<div class="rank-row ${rankingLabel(x,i,arr)===1?'first':''}"><span class="rank-num">${rankingLabel(x,i,arr)}.</span><div style="min-width:0;flex:1"><div class="rank-name">${esc(name(x.p))}</div><div class="rank-detail">${esc(wonderInfo(x.p)?.label||'')} · ${x.coin} mønter · ${stages.filter(c=>categoryScore(x.p,c.id)!==0).length} pointområder</div></div><div class="rank-pts">${x.v} <small>p</small></div></div>`).join('')}</div><div class="result-section"><div class="section-title">Pointfordeling</div><div class="result-table-scroll"><table class="result-table"><thead><tr><th>Område</th>${state.players.map(p=>`<th>${esc(name(p))}</th>`).join('')}</tr></thead><tbody>${stages.map(c=>`<tr><td>${c.glyph} ${c.name}</td>${state.players.map(p=>`<td>${categoryScore(p,c.id)}</td>`).join('')}</tr>`).join('')}<tr class="total"><td>Samlet</td>${state.players.map(p=>`<td>${total(p)}</td>`).join('')}</tr></tbody></table></div></div><div class="note">Ved pointlighed vinder spilleren med flest mønter. Er også mønterne ens, deles placeringen.</div><div class="results-actions"><button class="btn btn-secondary" data-action="copy">⧉ Kopiér resultat</button><button class="btn btn-secondary" data-action="edit">✎ Ret point</button></div><p class="new-game-hint">Beholder spillere og udvidelser, men nulstiller point og trækker nye vidundere.</p><button class="btn btn-primary wide" style="margin-top:10px" data-action="new">↻ Nyt spil</button></section>`}
 function getPlayer(id){return state.players.find(p=>p.id===id)}
 function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}
 function changeView(v){state.view=v;render();scrollTop()}
 app.addEventListener('click',e=>{
 const add=e.target.closest('[data-add]');if(add){let p=getPlayer(add.dataset.player);if(!p)return;let key=add.dataset.key,delta=+add.dataset.add; if(key.startsWith('science.')){let sub=key.split('.')[1];p.data.science[sub]=clamp(n(p.data.science[sub])+delta,0,999)}else{let signed=key==='military'||key==='naval';p.data[key]=clamp((+p.data[key]||0)+delta,signed?-999:0,999)}let input=document.querySelector('input[data-input="'+key+'"][data-player="'+p.id+'"]');if(input)input.value=p.data[key];refreshCard(p);save();return}
 const ct=e.target.closest('[data-count]');if(ct){let d=+ct.dataset.count;if(d>0&&state.players.length<7)state.players.push(newP(state.players.length));if(d<0&&state.players.length>3)state.players.pop();if(state.teams&&state.players.length%2===0)state.players.forEach((p,i)=>p.team=i%(state.players.length/2));render();return}
 const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
 if(action==='reroll-wonders'){rollWonders();render();toast('Nye vidundere fordelt');return}
 if(action==='start'){syncWonders();if(teamsEnabled()){const counts=Array.from({length:state.players.length/2},(_,j)=>state.players.filter(p=>p.team===j).length);if(counts.some(x=>x!==2)){toast('Hvert hold skal have præcis 2 spillere');return}}state.players.forEach((p,i)=>{p.name=p.name.trim()||'Spiller '+(i+1)});state.step=clamp(state.step,0,active().length-1);changeView('score')}
 else if(action==='setup'){changeView('setup')}
 else if(action==='next'){if(state.step>=active().length-1)changeView('results');else{state.step++;render();scrollTop()}}
 else if(action==='back'){state.step=Math.max(0,state.step-1);render();scrollTop()}
 else if(action==='results')changeView('results');
 else if(action==='back-from-results'){state.step=active().length-1;changeView('score')}
 else if(action==='edit'){state.step=0;changeView('score')}
 else if(action==='new'){if(confirm('Start et nyt spil? Alle point fra det nuværende spil slettes. Spillernavne og udvidelser beholdes, og der trækkes nye vidundere.')){state.players.forEach(p=>p.data=defaultData());rollWonders();state.step=0;changeView('setup')}}
 else if(action==='copy')copyResults();
 });
 app.addEventListener('change',e=>{let t=e.target;if(t.matches('[data-exp]')){state.exp[t.dataset.exp]=t.checked;state.step=0;render()}
 else if(t.matches('[data-opt="teams"]')){state.teams=t.checked;if(state.teams)state.players.forEach((p,i)=>p.team=i%(state.players.length/2));render()}
 else if(t.matches('[data-team]')){let p=getPlayer(t.dataset.team);if(p){p.team=+t.value;save()}}
 else if(t.matches('[data-eddebt]')){let p=getPlayer(t.dataset.player);if(p){p.data.edDebt[+t.dataset.eddebt]=t.checked;refreshCard(p);save()}}
 });
 app.addEventListener('input',e=>{let t=e.target;if(t.matches('[data-name]')){let p=getPlayer(t.dataset.name);if(p){p.name=t.value;const el=document.querySelector('[data-wonder-player="'+p.id+'"]');if(el)el.textContent=name(p);save()}}else if(t.matches('[data-input]')){let p=getPlayer(t.dataset.player);if(!p)return;let key=t.dataset.input;let raw=parseInt(t.value,10);p.data[key]=clamp(Number.isNaN(raw)?0:raw,(key==='military'||key==='naval')?-999:0,999);refreshCard(p);save()}});
 function copyResults(){const list=sortedResults();let txt='7 Wonders · Resultat\n'+list.map((x,i)=>`${rankingLabel(x,i,list)}. ${name(x.p)} (${wonderInfo(x.p)?.label||'Ukendt vidunder'}): ${x.v} point (${x.coin} mønter)`).join('\n')+'\n\n'+active().map(c=>c.name+': '+state.players.map(p=>`${name(p)} ${categoryScore(p,c.id)}`).join(', ')).join('\n');if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>toast('Resultatet er kopieret')).catch(()=>fallbackCopy(txt))}else fallbackCopy(txt)}
 function fallbackCopy(txt){let ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Resultatet er kopieret')}catch(_){toast('Kunne ikke kopiere teksten')}ta.remove()}
 render();
})();
</script>
