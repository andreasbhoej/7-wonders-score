<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Achievement Logger - Dune Uprising</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --danger: #dc2626;
      --gold: #b7791f;
      --gold-bg: #fff7ed;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    main {
      width: min(1040px, 92vw);
      margin: 48px auto;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2.25rem;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 22px;
    }

    .panel,
    .achievement-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    }

    .panel h2,
    .achievement-card h2 {
      margin: 0 0 10px;
      font-size: 1.2rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }

    .stat strong {
      display: block;
      font-size: 1.4rem;
    }

    .stat span {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .leaderboard {
      display: grid;
      gap: 8px;
    }

    .leaderboard-row {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 11px;
      background: #fff;
    }

    .leaderboard-row:first-child {
      background: var(--gold-bg);
      border-color: #fed7aa;
    }

    .rank {
      font-weight: 800;
      color: var(--gold);
    }

    .score {
      color: var(--muted);
      font-weight: 700;
    }

    .recent-list,
    .achievement-list {
      display: grid;
      gap: 18px;
    }

    .recent-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fff;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .recent-item strong {
      color: var(--text);
    }

    .achievement-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 16px;
      margin-bottom: 18px;
    }

    .achievement-title {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .badge {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: var(--gold-bg);
      color: var(--gold);
      font-weight: 900;
      border: 1px solid #fed7aa;
      flex: 0 0 auto;
    }

    .count {
      color: var(--muted);
      font-size: 0.95rem;
      white-space: nowrap;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 180px 180px auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 5px;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
      font: inherit;
      color: var(--text);
      background: #fff;
    }

    input:focus,
    select:focus {
      outline: 2px solid rgba(37, 99, 235, 0.18);
      border-color: var(--accent);
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 9px 12px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .primary-button {
      background: var(--accent);
      color: #fff;
      white-space: nowrap;
    }

    .primary-button:hover {
      background: var(--accent-dark);
    }

    .completion-list {
      display: grid;
      gap: 8px;
    }

    .completion {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
    }

    .completion-info {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .completion-info strong {
      color: var(--text);
    }

    .delete-button {
      background: transparent;
      color: var(--danger);
      padding: 4px 8px;
      font-size: 0.9rem;
    }

    .delete-button:hover {
      background: #fee2e2;
    }

    .empty-state {
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      background: #fff;
    }

    .status {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 900px) {
      .dashboard {
        grid-template-columns: 1fr;
      }

      form {
        grid-template-columns: 1fr;
      }

      .achievement-header,
      .completion {
        align-items: stretch;
        flex-direction: column;
      }

      .count {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Achievement Logger - Dune Uprising</h1>
      <p>Select an achievement and log who completed it, when, and with which leader.</p>
      <div class="status" id="syncStatus">Loading shared data...</div>
    </header>

    <section class="dashboard">
      <div class="panel">
        <h2>Leaderboard</h2>
        <div id="leaderboard" class="leaderboard"></div>
      </div>

      <div class="panel">
        <h2>Overview</h2>
        <div class="stats">
          <div class="stat">
            <strong id="totalCompletions">0</strong>
            <span>Total completions</span>
          </div>
          <div class="stat">
            <strong id="totalPlayers">0</strong>
            <span>Players</span>
          </div>
          <div class="stat">
            <strong id="completedTypes">0/8</strong>
            <span>Achievements hit</span>
          </div>
        </div>
        <h2 style="margin-top: 18px;">Recent activity</h2>
        <div id="recentActivity" class="recent-list"></div>
      </div>
    </section>

    <section id="achievementList" class="achievement-list"></section>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyvt_19cwIVXTmPgbtML9LJ7tSPNgKhd4UEFCcpJFDNGWoGbo2-NPDSQsaJkuhnCt8s7g/exec";
    const REFRESH_INTERVAL_MS = 5000;

    const leaders = [
      "AMBER",
      "ARIANA",
      "ARMAND ECAZ",
      "BARON",
      "CHANI",
      "DUNCAN",
      "ESMAR",
      "FEYD",
      "GURNEY",
      "HASIMIR",
      "ILESA",
      "ILBAN",
      "IRULAN",
      "JESSICA",
      "KOTA",
      "LETO",
      "LIET",
      "MARGOT",
      "MOHIAM",
      "MUAD'DIB",
      "PAUL ATREIDES",
      "PITER",
      "RHOMBUR",
      "SHADDAM",
      "STABAN",
      "TESSIA",
      "YUNA",
      "YRKOON"
    ];

    const achievements = [
      { id: "a1", name: "Buy two spice must flow on the same turn" },
      { id: "a2", name: "Buy 5 spice must flow in the same game" },
      { id: "a3", name: "End the game with 6 or more techs" },
      { id: "a4", name: "Have 4 or more worms in the same conflict" },
      { id: "a5", name: "Have 45 or more combat strength in one combat" },
      { id: "a6", name: "Get 5 points in one round" },
      { id: "a7", name: "End the game with 15 or more points" },
      { id: "a8", name: "Win the game in round 5" }
    ];

    const achievementList = document.getElementById("achievementList");
    const leaderboard = document.getElementById("leaderboard");
    const recentActivity = document.getElementById("recentActivity");
    const syncStatus = document.getElementById("syncStatus");
    const totalCompletions = document.getElementById("totalCompletions");
    const totalPlayers = document.getElementById("totalPlayers");
    const completedTypes = document.getElementById("completedTypes");

    let completions = [];
    let isLoading = false;

    renderAll();
    loadCompletions();
    setInterval(loadCompletions, REFRESH_INTERVAL_MS);

    achievementList.addEventListener("submit", async function (event) {
      event.preventDefault();

      const form = event.target;
      const achievementId = form.dataset.achievementId;
      const formData = new FormData(form);
      const achievement = achievements.find((item) => item.id === achievementId);

      const button = form.querySelector("button");
      button.disabled = true;
      button.textContent = "Saving...";
      syncStatus.textContent = "Saving...";

      try {
        await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "add",
            id: createId(),
            achievement: achievement.name,
            player: formData.get("player").trim(),
            leader: formData.get("leader"),
            date: formData.get("date")
          })
        });

        form.reset();
        form.querySelector('input[name="date"]').value = today();
        await loadCompletions();
      } catch (error) {
        alert("Could not save the achievement. Please try again.");
        console.error(error);
      } finally {
        button.disabled = false;
        button.textContent = "Add";
      }
    });

    achievementList.addEventListener("click", async function (event) {
      if (!event.target.matches(".delete-button")) return;

      const id = event.target.dataset.id;
      if (!confirm("Delete this completion?")) return;

      const button = event.target;
      button.disabled = true;
      button.textContent = "Deleting...";
      syncStatus.textContent = "Deleting...";

      try {
        await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "delete",
            id
          })
        });

        await loadCompletions();
      } catch (error) {
        alert("Could not delete the completion. Make sure your Apps Script supports delete.");
        console.error(error);
        button.disabled = false;
        button.textContent = "Delete";
      }
    });

    async function loadCompletions() {
      if (isLoading) return;
      isLoading = true;

      try {
        const response = await fetch(API_URL);
        const rows = await response.json();

        completions = rows.map((row, index) => {
          const achievementName = row.Achievement || row.achievement || "";
          const achievement = achievements.find((item) => item.name === achievementName);

          return {
            id: row.ID || row.Id || row.id || String(index),
            achievementId: achievement ? achievement.id : "",
            achievementName,
            player: row.Player || row.player || "",
            leader: row.Leader || row.leader || "",
            date: formatSheetDate(row.Date || row.date || "")
          };
        })
        .filter((completion) => completion.achievementId)
        .sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

        renderAll();
        syncStatus.textContent = `Synced ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}`;
      } catch (error) {
        renderAll();
        syncStatus.textContent = "Could not sync with Google Sheets.";
        console.error("Google Sheets load error:", error);
      } finally {
        isLoading = false;
      }
    }

    function renderAll() {
      renderDashboard();
      renderAchievements();
    }

    function renderDashboard() {
      totalCompletions.textContent = completions.length;

      const players = [...new Set(completions.map((item) => item.player).filter(Boolean))];
      totalPlayers.textContent = players.length;

      const achieved = new Set(completions.map((item) => item.achievementId));
      completedTypes.textContent = `${achieved.size}/${achievements.length}`;

      renderLeaderboard();
      renderRecentActivity();
    }

    function renderLeaderboard() {
      const scores = completions.reduce((acc, completion) => {
        if (!completion.player) return acc;
        acc[completion.player] = (acc[completion.player] || 0) + 1;
        return acc;
      }, {});

      const rows = Object.entries(scores)
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
        .slice(0, 8);

      if (rows.length === 0) {
        leaderboard.innerHTML = '<div class="empty-state">No players yet.</div>';
        return;
      }

      leaderboard.innerHTML = rows.map(([player, score], index) => `
        <div class="leaderboard-row">
          <div class="rank">#${index + 1}</div>
          <div><strong>${escapeHtml(player)}</strong></div>
          <div class="score">${score}</div>
        </div>
      `).join("");
    }

    function renderRecentActivity() {
      const recent = completions.slice(0, 5);

      if (recent.length === 0) {
        recentActivity.innerHTML = '<div class="empty-state">No recent activity yet.</div>';
        return;
      }

      recentActivity.innerHTML = recent.map((completion) => `
        <div class="recent-item">
          <strong>${escapeHtml(completion.player)}</strong> completed
          <strong>${escapeHtml(completion.achievementName)}</strong>
          with ${escapeHtml(completion.leader)} on ${formatDate(completion.date)}.
        </div>
      `).join("");
    }

    function renderAchievements() {
      achievementList.innerHTML = "";

      achievements.forEach((achievement, index) => {
        const achievementCompletions = completions.filter(
          (completion) => completion.achievementId === achievement.id
        );

        const card = document.createElement("article");
        card.className = "achievement-card";

        card.innerHTML = `
          <div class="achievement-header">
            <div class="achievement-title">
              <div class="badge">${index + 1}</div>
              <div>
                <h2>${escapeHtml(achievement.name)}</h2>
                <p>${achievementCompletions.length === 0 ? "Waiting for first completion." : "Latest completions shown first."}</p>
              </div>
            </div>
            <span class="count">${achievementCompletions.length} completed</span>
          </div>

          <form data-achievement-id="${achievement.id}">
            <div>
              <label for="player-${achievement.id}">Player</label>
              <input id="player-${achievement.id}" name="player" type="text" required />
            </div>

            <div>
              <label for="date-${achievement.id}">Date</label>
              <input id="date-${achievement.id}" name="date" type="date" required value="${today()}" />
            </div>

            <div>
              <label for="leader-${achievement.id}">Leader</label>
              <select id="leader-${achievement.id}" name="leader" required>
                <option value="">Choose leader</option>
                ${leaders.map((leader) => `<option value="${escapeHtml(leader)}">${escapeHtml(leader)}</option>`).join("")}
              </select>
            </div>

            <button class="primary-button" type="submit">Add</button>
          </form>

          <div class="completion-list">
            ${renderCompletions(achievementCompletions)}
          </div>
        `;

        achievementList.appendChild(card);
      });
    }

    function renderCompletions(items) {
      if (items.length === 0) {
        return '<div class="empty-state">No completions logged yet.</div>';
      }

      return items.map((completion) => `
        <div class="completion">
          <div class="completion-info">
            <strong>${escapeHtml(completion.player)}</strong> completed this on ${formatDate(completion.date)} with ${escapeHtml(completion.leader)}.
          </div>
          <button class="delete-button" type="button" data-id="${escapeHtml(completion.id)}">Delete</button>
        </div>
      `).join("");
    }

    function createId() {
      if (crypto.randomUUID) return crypto.randomUUID();
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function formatSheetDate(value) {
      if (!value) return "";

      if (typeof value === "string" && /^\d{4}-\d{2}-\d{2}/.test(value)) {
        return value.slice(0, 10);
      }

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;

      return date.toISOString().slice(0, 10);
    }

    function formatDate(dateString) {
      if (!dateString) return "No date";
      const date = new Date(dateString + "T00:00:00");
      return date.toLocaleDateString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric"
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
